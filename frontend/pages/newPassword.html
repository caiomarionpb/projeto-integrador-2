<!DOCTYPE html> <!-- Informa o tipo de documento que será utilizado nesta página -->
<html lang="pt-BR"> <!-- Informa a linguagem que será utilizada na página para orientar o browser -->
    <head>
        <meta charset="UTF-8"> <!-- Mapa de caracteres para a página -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"><!-- Adequa o tamanho da tela para garantir a responsividade -->
        <!-- Definição de favicon -->
        <link rel="icon" href="../img/Nota_Dez_Logo_Favicon.png" type="image/png">
        <!-- Link do Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <!-- Link de ícones do Bootstrap -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <!-- Links Fontes (Farro e League Spartan) -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Farro:wght@300;400;500;700&family=League+Spartan:wght@100..900&family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <!-- Links CSS -->
        <link rel="stylesheet" href="../styles/base.css">
        <link rel="stylesheet" href="../styles/baseForm.css">
        <!-- Nome da página principal -->
        <title>NotaDez - Reconfiguração de Senha</title>
    </head>

    
    <body>
        <!-- Página de nova senha -->
        <div id="form-background" class="center-col"> 
            <!-- Parte superior da tela de login -->
            <div id="header" class="container"> 
                <div class="row">
                    <!-- Linha decorativa -->
                    <div class="d-none d-md-flex col-md-3 col-lg-4 center">
                        <div class="line"></div>
                    </div>
                    <!-- Logo do Nota Dez com a imagem.png -->
                    <div class="col-12 col-md-6 col-lg-4 center-col logoField px-5">
                        <img src="../img/notadez_logo.png">
                    </div>
                    <!-- Linha decorativa -->
                    <div class="d-none d-md-flex col-md-3 col-lg-4 center">
                        <div class="line"></div>
                    </div>
                </div>
                <row class="mb-3 center">
                    <!-- Mensagem informativa para o usuário -->
                    <p>Recuperação de senha</p>
                </row>
            </div>
            <!-- Início do formulário -->
            <form id="newPasswordForm">
                <!-- Conteúdo principal da página -->
                <div id="mainContent" class="center-col">
                    <!-- Campo de e-mail -->
                    <div class="formField form-floating my-3">
                        <!-- Campo de preenchimento -->
                        <input id="inputEmail" type="email" class="form-control" placeholder="E-mail de cadastro" required/>
                        <!-- Campo para informar o e-mail -->
                        <label for="inputEmail">E-mail:</label>
                    </div>
                    <!-- Campo de senha -->
                    <div class="formField form-floating mt-3 inputBox validation validationBorder">
                        <!-- Campo de preenchimento do nova senha -->
                        <input id="inputNewPass" type="password" class="form-control validationBorder" placeholder="Nova senha" required/>
                        <!-- Declarando botão mostrar/ocultar senha-->
                        <span id="eyeButton1"><i class="bi bi-eye"></i></span>
                        <!-- Nome do campo de nova senha -->
                        <label for="inputNewPass">Nova senha:</label>
                        <div class="my-2 ms-2 inputRules">
                            <p>Sua senha deve conter:</p>
                            <ul>
                                <!-- Restrições para criação de senha-->
                                <li id="min6">No mínimo 6 caracteres </li>
                                <li id="max20">No máximo 20 caracteres</li>
                                <li id="minLetter">No mínimo uma letra</li>
                                <li id="minNum">No mínimo um número</li>
                            </ul>
                        </div>
                    </div>
                    <!-- Campo de Confirmação de nova senha -->
                    <div class="formField form-floating mb-2 inputBox validationBorder">
                        <!-- Campo de preenchimento da confirmação de nova senha -->
                        <input id="inputConfirmPass" type="password" class="form-control validationBorder" placeholder="Confirmação de nova senha" required/>
                        <!--Declaração de botão mostrar/ocultar senha-->
                        <span id="eyeButton2"><i class="bi bi-eye"></i></span>
                        <!-- Nome do campo de confirmação de nova senha -->
                        <label for="inputConfirmPass">Confirmar senha:</label>
                    </div>
                    <!-- Botão para envio -->
                    <div id="redefinePass" class="formField my-3">
                        <button type="submit" class="button-style">Redefinir</button>
                    </div>
                <!-- Fim do conteúdo principal da página -->
                </div>
            <!-- Fim do fomrulário -->
            </form>
        </div>
        
        <!-- Script Bootstrap -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <!-- Script da página de nova senha -->
        <script type="module" src="../scripts/newPassword.js" defer></script>
    </body>
</html>
