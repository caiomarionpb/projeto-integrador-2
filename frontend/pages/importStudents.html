<!DOCTYPE html> <!-- Informa o tipo de documento que será utilizado nesta página -->
<html lang="pt-br"> <!-- Informa a linguagem que será utilizada na página para orientar o browser-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../img/Nota_Dez_Logo_Favicon.png" type="image/png">
    <title>NotaDez - Turmas</title>
    <!-- Links Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Link de ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Links Fontes (Farro e League Spartan) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Farro:wght@300;400;500;700&family=League+Spartan:wght@100..900&family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <!-- Links CSS -->
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="../styles/baseForm.css">
</head>
<body>
    <!-- Página importação de Alunos via .csv -->
    <div id="form-background" class="center-col marginPage">
        <!-- Parte superior da tela de importação do CSV de alunos -->
        <div id="header" class="container"> 
            <div class="row">
                <!-- Linha decorativa -->
                <div class="d-none d-md-flex col-md-3 col-lg-4 center">
                    <div class="line"></div>
                </div>
                <!-- Logo do Nota Dez com a imagem.png -->
                <div class="col-12 col-md-6 col-lg-4 center-col logoField px-5">
                    <img src="../img/notadez_logo.png">
                </div>
                <!-- Linha decorativa -->
                <div class="d-none d-md-flex col-md-3 col-lg-4 center">
                    <div class="line"></div>
                </div>
            </div>
   
            <row class="mb-3 center">
                <!-- Mensagem de boas vindas o usuário -->
                <p class="headerMessage">Importação de alunos (.CSV)</p>
            </row>
        </div>
        <!-- Div para conteúdo principal -->
        <div id="mainContent" class="management-section center-col">
            <!-- <h1>Importar Alunos (CSV)</h1> -->
            <p>Selecione um arquivo .csv com as colunas 'Matrícula' e 'Nome'.</p>
            <!-- Div para o input do arquivo CSV -->
            <div class="center-col mb-3">
                <input id="csvFile" type="file" class="form-control my-3" accept=".csv">
            </div>
            <!-- Botão para enviar o arquivo CSV -->
            <button class="button-style" type="button" id="enviarCsv">
                <i class="bi bi-upload"></i> Enviar Arquivo
            </button>
            <!-- Parágrafo onde é informado o status da importação do arquivo CSV -->
            <p id="statusCsv" class="my-3">Aguardando arquivo...</p>
        </div>  
        
        
    </div>    
    </div> 

    <!-- Scripts Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script da página de importação de alunos -->
    <script type="module" src="/frontend/scripts/importStudents.js"></script>
</body>
</html>
