<!DOCTYPE html> <!-- Informa o tipo de documento que será utilizado nesta página -->
<html lang="pt-BR"> <!-- Informa a linguagem que será utilizada na página para orientar o browser -->
    <head>
        <meta charset="UTF-8"> <!-- Mapa de caracteres para a página -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Adequa o tamanho da tela para garantir a responsividade -->
        <!-- Definição de favicon -->
        <link rel="icon" href="../img/Nota_Dez_Logo_Favicon.png" type="image/png">
        <!-- Link do Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <!-- Link de ícones do Bootstrap -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <!-- Links Fontes (Farro e League Spartan) -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Farro:wght@300;400;500;700&family=League+Spartan:wght@100..900&family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <!-- Links CSS -->
        <link rel="stylesheet" href="../styles/base.css">
        <link rel="stylesheet" href="../styles/baseForm.css">
        <!-- Nome da página principal -->
        <title>NotaDez - Cadastro</title>
    </head>


    <body>
        <!-- Página para cadastro -->
        <div id="form-background" class="center-col my-5 marginPage">
            <!-- Parte superior da tela de Cadastro -->
            <div id="header" class="container"> 
                <div class="row">
                    <!-- Linha decorativa -->
                    <div class="d-none d-md-flex
                    col-md-3 col-lg-4 center">
                        <div class="line"></div> 
                    </div>
                    <!-- Logo do Nota Dez com a imagem .png -->
                    <div class="col-12 col-md-6
                    col-lg-4 center-col logoField
                    px-5"> 
                        <img src="../img/notadez_logo.png"> 
                    </div>
                    <!-- Linha decorativa -->
                    <div class="d-none d-md-flex col-md-3 col-lg-4 center">
                        <div class="line"></div>
                    </div>
                </div>
                <row class="mb-3 center">
                <!-- Mensagem informativa -->
                    <p class="headerMessage">A plataforma de gerenciamento para o docente</p> 
                </row>
            </div>
            <!-- Início de formulário -->
            <form id="registerForm">
                <!-- Conteúdo principal da pagina -->
                <div id="mainContent" class="center-col">
                    <!-- Campo de nome completo -->
                    <div class="formField my-3 form-floating inputBox ">
                        <!-- Campo de preenchimento do nome completo -->
                        <input id="inputFirstName" type="text" class="form-control validationBorder" placeholder="Nome completo" maxlength="175" required/>
                        <!-- Nome do campo de nome completo -->
                        <label for="inputFirstName">Nome completo:</label>
                
                    </div>
                    <div class="formField inputBox form-floating my-3">
                        <!-- Campo de preenchimento do e-mail-->
                        <input id="inputEmail" class="form-control validationBorder" type="email" placeholder="E-mail" maxlength="200" required/>
                        <!-- Nome do campo de e-mail -->
                        <label for="inputEmail">E-mail:</label>
                        <div class="inputRules my-2 ms-2">
                            <p> Exemplo: example@email.com </p>
                        </div>
                
                    </div>
                    <div class="formField inputBox form-floating mb-3">
                        <!-- Campo de preenchimento do telefone celular -->
                        <input id="inputTel" class="form-control validationBorder" type="tel" placeholder="Telefone celular" required/>
                        <!-- Nome do campo de telefone celular -->
                        <label for="inputTel">Telefone celular:</label>
                        <div class="inputRules mt-2 ms-2">
                            <p>Incluindo DDD</p>
                        </div>
                
                    </div>
                    <div class="validation inputBox">
                        <div class="formField inputBox form-floating mt-2 mb-3">
                            <!-- Campo de preenchimento de senha -->
                            <input id="inputNewPass" type="password" class="form-control validationBorder" placeholder="Nova senha" required/>
                            <!-- Declaração de botão mostrar/ocultar senha-->
                            <span id="eyeButton1"><i class="bi bi-eye"></i></span>
                            <!-- Nome do campo de senha -->
                            <label for="inputNewPass">Senha:</label>
                            <div class="inputRules my-2 ms-2">
                                <p>Sua senha deve conter:</p>
                                <!-- Restrições para criação de senha-->
                                <ul>
                                    <!-- Lista de restrições para a criação de senha -->
                                    <li id="min6">No mínimo 6 caracteres </li>
                                    <li id="max20">No máximo 20 caracteres </li>
                                    <li id="minLetter">No mínimo uma letra </li>
                                    <li id="minNum">No mínimo um número </li>
                                </ul>
                            </div>
                
                        </div>
                        <!-- Campo de preenchimento -->
                        <div class="formField inputBox form-floating mb-3">
                            <!-- Campo de preenchimento de confirmação de senha -->
                            <input id="inputConfirmPass" type="password" class="form-control validationBorder" placeholder="Confirmação de senha" required>
                            <!-- Declaração de botão mostrar/ocultar senha -->
                            <span id="eyeButton2"><i class="bi bi-eye"></i></span>
                            <!-- Nome do campo de confirmação de senha -->
                            <label for="inputConfirmPass">Confirmação de senha:</label>
                
                        </div>
                    </div>
                    <!-- Botão para cadastro -->
                    <div class="formField my-3">
                        <button class="button-style" type="submit">Cadastrar</button>
                    </div>
                </div>
            <!-- Fim do formulário-->
            </form>
            <!-- Realização de login -->
            <div id="User" class="center mt-3 text-center">
                <p>Já é cadastrado? <br><a href="./index.html" class="link-style">Faça login!</a></p>
            </div>
        <!-- Fim da página de cadastro -->
        </div>
        
        <!-- Script Bootstrap -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <!-- Script para a página de registro -->
        <script type="module" src="../scripts/register.js"></script>
    </body>
</html>
