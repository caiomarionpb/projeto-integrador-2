<!DOCTYPE html> <!-- Informa o tipo de documento que será utilizado nesta página -->
<html lang="pt-br"> <!-- Informa a linguagem que será utilizada na página para orientar o browser-->
    <head>
        <meta charset="UTF-8"> <!-- Mapa de caracteres para a página -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"><!-- Adequa o tamanho da tela para garantir a responsividade -->
        <!-- Definição de favicon -->
        <link rel="icon" href="../img/Nota_Dez_Logo_Favicon.png" type="image/png">
        <!-- Nome da página principal -->
        <title>NotaDez - Turmas</title>
        <!-- Links Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <!--Link de ícones do Bootstrap-->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <!-- Links Fontes (Farro e League Spartan)-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Farro:wght@300;400;500;700&family=League+Spartan:wght@100..900&family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Farro:wght@300;400;500;700&family=League+Spartan:wght@100..900&family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <!-- Links CSS -->
        <link rel="stylesheet" href="../styles/base.css">
        <link rel="stylesheet" href="../styles/basePages.css">
        <link rel="stylesheet" href="../styles/addStudents.css">
    </head>

    <body>
        <!-- Conteúdo da página -->
        <div id="main" class="row">
            <!-- Sidebar/Menu lateral para acesso aos recursos do docente -->
            <div class="sideBar d-none d-sm-flex col-sm-4 col-lg-3">
                <!-- Definindo largura de 100% para o conteúdo sidebar -->
                <div class="w100">
                    <!-- Seção do logo da plataforma -->
                    <div class="logoField center w100 my-4">
                        <!-- Logo do Nota Dez com a imagem.png -->
                        <img src="../img/Nota_Dez_branco.png" >
                    </div>
                    <div class="center my-3">
                        <button id="logoutButton"><i class="bi bi-box-arrow-left"></i>Sair</button>
                    </div>
                    
                    <!-- Menu lateral (aberto por default) -->
                    <div id="menu-container">
                        
                    </div>
                </div>
            </div>
            
            <!-- Painel de controle-->
            <div class="col-12 col-sm-8 col-lg-9">
                <!-- Cabeçalho -->
                <div id="header" class="my-3">
                    <!--Seção do perfil-->
                    <div id="profileField" class="center">
                        <!-- Mensagens de boas vindas para o usuário-->
                        <p id="greeting">Bem vindo de volta!</p>
                        <!--Icone de usuário-->
                        <span id="userIcon"><i class="bi bi-person-circle"></i></span>
                    </div>
                    <!-- Linha decorativa -->
                    <div class="line"></div>
                </div>

                <!-- Conteúdo principal da página -->
                <div id="mainContent">
                    <!-- Seção com os elementos que compõem a página -->
                    <div id="mainTitle" class="mb-4 row">
                        <!-- Seção para o título da página -> Será sobrescrito em TypeScript pela turma específica (Ex.: Alunos - Turma 0101) -->
                        <div class="row">
                            <!-- Título que vai aparecer no topo da página: "Alunos - " -->
                            <h1 id="studentsTitle">Alunos</h1>
                        </div>
                        <!-- Grupo de botões para a página de alunos -->
                        <div class="row">
                            <div id="students">
                                <div id="addStudents">
                                    <!-- Botão para adicionar alunos -->
                                    <button id="btnAddStudents" class="button-style">Gerenciar Alunos</button>
                                </div>
                                <div id="addComponent">
                                    <!-- Botão para adicionar componentes de nota -->
                                    <button id="btnAddComponent" class="button-style">+ Adicionar Componente</button>
                                </div>
                                <div id="btnCalcFinalGrade">
                                    <!-- Botão para calcular média funcional -->
                                    <button class="button-style"><i class="bi bi-calculator-fill"></i>Calcular Média Final </button>
                                </div>
                                    <div id="exportCsv">
                                    <!-- Botão para editar notas -->
                                    <button id="btnExportCsv" class="button-style">
                                        <!-- Ícone do botão de editar notas -->
                                        <span id ="editIcon"><i class="bi bi-box-arrow-up"></i></span>
                                        </span>
                                        <!-- Texto que aparece no botão -->
                                        <span>Exportar CSV</span>
                                    </button>
                                </div>
                                <!-- Fim do grupo de botões -->
                            </div>
                        </div>
                    <!-- Fim da seção mainContent -->
                    </div>
                    
                    <div class="table-responsive-scroll">
                        <!-- Tabela de alunos que será preenchida pelo JS que tem a classe de hover para destacar a linha que tem o ponteiro do mouse -->
                        <table class="table table-hover">
                            <!-- Cabeçalho da tabela -->
                            <thead id="table-component">
                                <tr >
                                    <!-- JS será inserido aqui -->
                                </tr>
                            </thead>
                            <!-- Seção (corpo da tabela) para exibir as notas e infos dos alunos -->
                            <tbody id="table-data">
                                <!-- JS será inserido aqui -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
        
        <!-- Script Bootstrap -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <!-- Script da página de visualização de alunos -->
        <script type="module" src="../scripts/students.js" defer> </script>
    </body>

</html>
