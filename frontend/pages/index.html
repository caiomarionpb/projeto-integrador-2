<!DOCTYPE html> <!-- Informa o tipo de documento que será utilizado nesta página -->
<html lang="pt-BR"> <!-- Informa a linguagem que será utilizada na página para orientar o browser -->
    <head>
        <meta charset="UTF-8"> <!-- Mapa de caracteres para a página -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"><!-- Adequa o tamanho da tela para garantir a responsividade -->
        <!-- Definição de favicon -->
        <link rel="icon" href="../img/Nota_Dez_Logo_Favicon.png" type="image/png">
        <!-- Nome da página principal -->
        <title>NotaDez - Bem vindo de volta!</title>
        <!-- Link do Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <!-- Link de ícones do Bootstrap -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <!-- Links Fontes (Farro e League Spartan) -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Farro:wght@300;400;500;700&family=League+Spartan:wght@100..900&family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <!-- Links CSS -->
        <link rel="stylesheet" href="../styles/base.css">
        <link rel="stylesheet" href="../styles/baseForm.css">
    </head>


    <body>
        <!-- Página de login/ Página principal -->
        <div id="form-background" class="center-col"> 
            <!-- Parte superior da tela de login -->
            <div id="header" class="container"> 
                <div class="row">
                    <!-- Linha decorativa -->
                    <div class="d-none d-md-flex col-md-3 col-lg-4 center">
                        <div class="line"></div>
                    </div>
                    <!-- Logo do Nota Dez com a imagem.png -->
                    <div class="col-12 col-md-6 col-lg-4 center-col logoField px-5">
                        <img src="../img/notadez_logo.png">
                    </div>
                    <!-- Linha decorativa -->
                    <div class="d-none d-md-flex col-md-3 col-lg-4 center">
                        <div class="line"></div>
                    </div>
                </div>
                <row class="mb-3 center">
                    <!-- Mensagem de boas vindas o usuário -->
                    <p>Bem vindo de volta!</p>
                </row>
            </div>
            <!-- Início do formulário -->
            <form id="loginForm">
                <!-- Conteúdo principal da página -->
                <div id="mainContent" class="center-col">
                    <!-- Campo de email -->
                    <div class="formField form-floating my-3">
                        <!-- Campo de preenchimento do e-mail-->
                        <input id="inputEmail" type="email" class="form-control" placeholder="E-mail" required/>
                        <!-- Nome do campo de e-mail -->
                        <label for="inputEmail">E-mail:</label>
                    </div>
                    <!-- Campo de senha -->
                    <div class="formField form-floating my-2 inputBox">
                        <!-- Campo de preenchimento da senha -->
                        <input id="inputNewPass" type="password" class="form-control" placeholder="Senha" required>
                        <!-- Declaração de botão mostrar/ocultar senha -->
                        <span id="eyeButton1"><i class="bi bi-eye"></i></button></span>
                        <!-- Nome do campo de senha -->
                        <label for="inputNewPass">Senha:</label>
                        <!-- Link para a redefinição de senha -->
                        <p class="ms-2 my-1 link-form"><a href="./sendLink.html" class="link-style">Esqueci minha senha</a></p>
                    </div>
                    <!-- Botão para envio -->
                    <div class="formField my-3">
                        <button type="submit" class="button-style" id="btnLogin">Entrar</button>
                    </div>
                </div>
                    <!-- Realização de novo cadastro -->
                <div id="newUser" class="center-col mt-3">
                    <p>Não possui uma conta ainda?</p>
                    <!-- Link para o novo usuário efetuar o cadastro -->
                    <p><a href="./register.html" class="link-style">Cadastre-se agora!</a></p>
                </div>
            <!-- Fim do formulário -->
            </form>
        </div>

        <!-- Script Bootstrap -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script type="module" src="../scripts/login.js"></script>
    </body>
</html>
